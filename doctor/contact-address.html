|--------------------------------------------------------------------------
| Doctor Contact & Address Section
|--------------------------------------------------------------------------
| Self-contained contact-address file.
| Old contact display logic is kept unchanged.
|--------------------------------------------------------------------------

require_once __DIR__ . '/../includes/functions.php';

$slug = $_GET['slug'] ?? '';

if (!isset($doctor) || !is_array($doctor)) {
    $doctor = function_exists('get_doctor_by_slug') ? get_doctor_by_slug($slug) : null;
}

if (!$doctor || !is_array($doctor)) {
    return;
}

/*
|--------------------------------------------------------------------------
| Basic Language Fallbacks
|--------------------------------------------------------------------------
*/

if (!defined('CURRENT_LANG')) {
    $current_request_path = parse_url($_SERVER['REQUEST_URI'] ?? '/', PHP_URL_PATH);
    $current_request_path = trim((string)$current_request_path, '/');

    if (defined('APP_URL')) {
        $app_path = trim((string)(parse_url(APP_URL, PHP_URL_PATH) ?? ''), '/');

        if ($app_path !== '' && str_starts_with($current_request_path, $app_path)) {
            $current_request_path = trim(substr($current_request_path, strlen($app_path)), '/');
        }
    }

    define('CURRENT_LANG', ($current_request_path === 'bn' || str_starts_with($current_request_path, 'bn/')) ? 'bn' : 'en');
}

if (!function_exists('__t')) {
    function __t(string $key, string $fallback = ''): string
    {
        $lang = defined('CURRENT_LANG') ? CURRENT_LANG : 'en';
        $base_dir = dirname(__DIR__);
        $default_file = $base_dir . '/languages/en.php';
        $lang_file = $base_dir . '/languages/' . $lang . '.php';

        static $translations = null;

        if ($translations === null) {
            $translations = [];

            if (file_exists($default_file)) {
                $default_translations = require $default_file;

                if (is_array($default_translations)) {
                    $translations = $default_translations;
                }
            }

            if ($lang !== 'en' && file_exists($lang_file)) {
                $current_translations = require $lang_file;

                if (is_array($current_translations)) {
                    $translations = array_merge($translations, $current_translations);
                }
            }
        }

        $value = $translations[$key] ?? '';

        if (trim((string)$value) !== '') {
            return (string)$value;
        }

        return $fallback !== '' ? $fallback : $key;
    }
}

if (!function_exists('lang_text')) {
    function lang_text(string $english = '', string $bangla = ''): string
    {
        if (defined('CURRENT_LANG') && CURRENT_LANG === 'bn' && trim($bangla) !== '') {
            return $bangla;
        }

        return $english;
    }
}

/*
|--------------------------------------------------------------------------
| Contact Helpers
|--------------------------------------------------------------------------
*/

if (!function_exists('doctor_contact_field')) {
    function doctor_contact_field(array $doctor, string $key): string
    {
        $english = trim((string)($doctor[$key] ?? ''));
        $bangla = trim((string)($doctor[$key . '_bn'] ?? ''));

        return trim(lang_text($english, $bangla));
    }
}

if (!function_exists('doctor_contact_has_any')) {
    function doctor_contact_has_any(array $doctor, array $keys): bool
    {
        foreach ($keys as $key) {
            if (doctor_contact_field($doctor, $key) !== '') {
                return true;
            }
        }

        return false;
    }
}

if (!function_exists('doctor_contact_phone_link')) {
    function doctor_contact_phone_link(string $phone): string
    {
        $phone = trim($phone);

        if ($phone === '') {
            return '';
        }

        return preg_replace('/[^\d+]/', '', $phone);
    }
}

/*
|--------------------------------------------------------------------------
| Contact Data
|--------------------------------------------------------------------------
*/

$doctor_contact_keys = [
    'phone',
    'whatsapp',
    'email',
    'address',
    'google_map_url',
    'area_locality',
    'road_street',
    'house_building',
    'post_code',
    'doctor_division',
    'doctor_district',
    'doctor_thana',
];

if (!doctor_contact_has_any($doctor, $doctor_contact_keys)) {
    return;
}

$contact_parts = [];

if (doctor_contact_field($doctor, 'phone') !== '') {
    $contact_parts[] = __t('phone', 'Phone') . ': ' . doctor_contact_field($doctor, 'phone');
}

if (doctor_contact_field($doctor, 'whatsapp') !== '') {
    $contact_parts[] = __t('whatsapp', 'WhatsApp') . ': ' . doctor_contact_field($doctor, 'whatsapp');
}

if (doctor_contact_field($doctor, 'email') !== '') {
    $contact_parts[] = __t('email', 'Email') . ': ' . doctor_contact_field($doctor, 'email');
}

$area_text = trim(implode(', ', array_filter([
    doctor_contact_field($doctor, 'doctor_thana'),
    doctor_contact_field($doctor, 'doctor_district'),
    doctor_contact_field($doctor, 'doctor_division'),
])));

$full_address_parts = array_filter([
    doctor_contact_field($doctor, 'house_building'),
    doctor_contact_field($doctor, 'road_street'),
    doctor_contact_field($doctor, 'area_locality'),
    doctor_contact_field($doctor, 'address'),
    doctor_contact_field($doctor, 'post_code'),
]);

$full_address_text = trim(implode(', ', $full_address_parts));
$google_map_url = doctor_contact_field($doctor, 'google_map_url');

?>
